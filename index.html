<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Letter for Swagatika</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap');
    
    * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-sign { font-family: 'Great Vibes', cursive; }
    .font-hand { font-family: 'Caveat', cursive; }

    body {
      margin: 0;
      background-color: #080812;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Custom Animations */
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; filter: blur(20px); }
      50% { opacity: 0.8; filter: blur(30px); }
    }
    @keyframes heartFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [openPassModal, setOpenPassModal] = useState(false);
      const [password, setPassword] = useState("");
      const [isWrong, setIsWrong] = useState(false);
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const handleOpen = () => {
        if (password.trim().toLowerCase() === "swagatika") {
          setIsUnlocked(true);
          setOpenPassModal(false);
          setTimeout(() => {
            if (audioRef.current) {
              audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
            }
          }, 500);
        } else {
          setIsWrong(true);
          setTimeout(() => setIsWrong(false), 800);
        }
      };

      const togglePlay = () => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
            setIsPlaying(false);
          } else {
            audioRef.current.play();
            setIsPlaying(true);
          }
        }
      };

      return (
        <div style={{ minHeight: '100vh', position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
          
          {/* Background Music */}
          <audio ref={audioRef} src="khat.mp3" loop />

          {/* Romantic Background Orbs */}
          <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 0 }}>
            <div style={{ position: 'absolute', top: '10%', left: '15%', width: '300px', height: '300px', borderRadius: '50%', background: 'rgba(255, 77, 141, 0.15)', filter: 'blur(80px)', animation: 'floatOrb 10s ease-in-out infinite' }} />
            <div style={{ position: 'absolute', bottom: '10%', right: '15%', width: '350px', height: '350px', borderRadius: '50%', background: 'rgba(139, 92, 246, 0.15)', filter: 'blur(90px)', animation: 'floatOrb 12s ease-in-out infinite' }} />
          </div>

          {!isUnlocked ? (
            /* ENVELOPE CARD FRONT */
            <div className="glass-card" style={{ padding: '40px 30px', borderRadius: '24px', textAlign: 'center', maxWidth: '420px', width: '100%', zIndex: 10 }}>
              <p style={{ textTransform: 'uppercase', letterSpacing: '3px', fontSize: '11px', color: '#fde68a', opacity: 0.8 }}>A Private Letter</p>
              <h1 className="font-playfair" style={{ fontSize: '32px', margin: '15px 0', background: 'linear-gradient(to right, #ffffff, #ffc2d9)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                For Swagatika
              </h1>
              
              <div style={{ margin: '30px 0', cursor: 'pointer' }} onClick={() => setOpenPassModal(true)}>
                <div className="gold-glow" style={{ width: '80px', height: '80px', borderRadius: '50%', background: 'radial-gradient(circle, #fde68a, #d4af37)', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span className="font-playfair" style={{ fontSize: '36px', color: '#2a1e05', fontWeight: 'bold' }}>S</span>
                </div>
              </div>

              <button onClick={() => setOpenPassModal(true)} style={{ background: 'linear-gradient(90deg, #ff4d8d, #a855f7)', border: 'none', color: '#fff', padding: '12px 28px', borderRadius: '30px', cursor: 'pointer', fontWeight: '500', fontSize: '14px', boxShadow: '0 10px 25px rgba(255,77,141,0.4)' }}>
                Tap to open the letter ♥
              </button>
            </div>
          ) : (
            /* LETTER CONTENT AFTER UNLOCK */
            <div className="glass-card" style={{ padding: '30px', borderRadius: '28px', maxWidth: '680px', width: '100%', zIndex: 10, marginTop: '20px' }}>
              
              {/* Music Player Bar */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '15px', padding: '15px 20px', background: 'rgba(255,255,255,0.05)', borderRadius: '18px', marginBottom: '30px' }}>
                <button onClick={togglePlay} style={{ width: '45px', height: '45px', borderRadius: '50%', border: 'none', background: '#ff4d8d', color: '#fff', cursor: 'pointer', fontSize: '18px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  {isPlaying ? '❚❚' : '▶'}
                </button>
                <div>
                  <p style={{ margin: 0, fontWeight: '600', fontSize: '15px' }}>Khat — Navjot Ahuja</p>
                  <p style={{ margin: '3px 0 0 0', fontSize: '11px', opacity: 0.5, letterSpacing: '1px' }}>PLAYING FOR YOU ONLY</p>
                </div>
              </div>

              {/* Letter Header */}
              <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                <p style={{ fontSize: '11px', letterSpacing: '2px', color: '#ffb3d1', textTransform: 'uppercase' }}>NAVJOT AHUJA • KHAT</p>
                <h2 className="font-playfair" style={{ fontSize: '28px', color: '#f7e8d0', margin: '10px 0' }}>A small letter for you :)</h2>
              </div>

              {/* Lyrics Content */}
              <div className="font-playfair" style={{ fontSize: '17px', lineHeight: '1.9', color: 'rgba(255,255,255,0.85)', textAlign: 'center' }}>
                <p>Kaagaz ke phool laau <span style={{ color: '#ff9ac1' }}>tere liye</span></p>
                <p>Khat likhu <span style={{ color: '#ff9ac1' }}>tere liye</span></p>
                <p>Mai Khuda me maanu nahi</p>
                <p>Par maangu dua <span style={{ color: '#ff9ac1' }}>tere liye</span></p>
                
                <br />
                <p>Tere liye ghar banaau</p>
                <p>Deewaarein neele rang se sajaau</p>
                <p>Pasand hai tumhe, maloom hai</p>
                <p>Tumne bataya tha ek dafe...</p>
                
                <br />
                <p style={{ fontSize: '19px', fontWeight: 'bold', color: '#ffffff' }}>Dekh shayar bana <span style={{ color: '#ff9ac1' }}>tere liye</span></p>
                <p style={{ fontSize: '19px', fontWeight: 'bold', color: '#ffffff' }}>Nagma likha <span style={{ color: '#ff9ac1' }}>tere liye</span></p>
                <p>Mai Khuda me maanu kyun</p>
                <p style={{ fontSize: '20px', fontWeight: 'bold', color: '#ffd1e8' }}>Tu Khuda mere liye ♥</p>
              </div>

              {/* Signature */}
              <div style={{ textAlign: 'right', marginTop: '40px' }}>
                <p className="font-sign" style={{ fontSize: '42px', color: '#ffb3d1', margin: 0 }}>Your Suman ♥</p>
                <p className="font-hand" style={{ fontSize: '14px', color: 'rgba(255,255,255,0.4)', margin: 0 }}>always yours — forever</p>
              </div>
            </div>
          )}

          {/* PASSWORD MODAL */}
          {openPassModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(5,5,16,0.8)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: '20px' }}>
              <div className="glass-card" style={{ padding: '30px', borderRadius: '20px', maxWidth: '340px', width: '100%', textAlign: 'center' }}>
                <h3 className="font-playfair" style={{ fontSize: '20px', margin: '0 0 10px 0' }}>Enter Password</h3>
                <p style={{ fontSize: '12px', color: 'rgba(255,255,255,0.5)', marginBottom: '20px' }}>Hint: Her name ;)</p>
                
                <input 
                  type="text" 
                  placeholder="Enter password..." 
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.2)', background: 'rgba(255,255,255,0.05)', color: '#fff', outline: 'none', marginBottom: '15px', textAlign: 'center' }}
                />

                {isWrong && <p style={{ color: '#ff4d8d', fontSize: '12px', marginBottom: '10px' }}>Wrong password 💔</p>}

                <button onClick={handleOpen} style={{ width: '100%', padding: '12px', borderRadius: '10px', border: 'none', background: 'linear-gradient(90deg, #ff4d8d, #a855f7)', color: '#fff', fontWeight: '600', cursor: 'pointer' }}>
                  Unlock Letter
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
